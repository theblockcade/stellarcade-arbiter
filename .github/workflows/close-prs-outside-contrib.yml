name: Close PRs touching files outside contrib/

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, edited, synchronize]
    branches: [main]

permissions:
  pull-requests: write

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            if (pr.state === "closed") return;

            // Maintainers (owner, org members, collaborators) may touch anything.
            //
            // The payload's author_association is NOT sufficient on its own: it is
            // computed without visibility into *private* org membership, so a
            // private member of the owning org arrives here as "CONTRIBUTOR" and
            // gets their own PR auto-closed. That happened in the sibling
            // stellarcade-sdk repo, which shipped an identical copy of this guard.
            //
            // checkCollaborator is the reliable signal: it works with the default
            // GITHUB_TOKEN and returns true for anyone with write/admin on the
            // repo, regardless of whether their org membership is public.
            if (["OWNER", "MEMBER", "COLLABORATOR"].includes(pr.author_association)) return;

            try {
              await github.rest.repos.checkCollaborator({
                owner: context.repo.owner,
                repo: context.repo.repo,
                username: pr.user.login,
              });
              return; // 204 = is a collaborator; treat as maintainer.
            } catch (err) {
              // 404 = not a collaborator. Anything else is an unexpected API
              // failure — fail open rather than closing a PR on a network blip.
              if (err.status !== 404) {
                core.warning(
                  `Collaborator check failed for ${pr.user.login} (${err.status}); skipping guard.`,
                );
                return;
              }
            }

            const ALLOWED_PREFIX = "contrib/";
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100,
            });

            const outside = files.map((f) => f.filename).filter((path) => !path.startsWith(ALLOWED_PREFIX));
            if (outside.length === 0) return;

            const repoUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}`;
            const list = outside.slice(0, 20).map((p) => `- \`${p}\``).join("\n");
            const more = outside.length > 20 ? `\n- …and ${outside.length - 20} more` : "";

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body: [
                "Thanks for the contribution — but contributor PRs may only change files inside `contrib/`.",
                "",
                "This PR touches file(s) outside that folder:",
                "",
                list + more,
                "",
                `See [CONTRIBUTING.md](${repoUrl}/blob/main/CONTRIBUTING.md) and [contrib/README.md](${repoUrl}/blob/main/contrib/README.md). If your change genuinely needs to touch settlement-critical code, open an issue first and confirm scope before opening a PR outside \`contrib/\`.`,
              ].join("\n"),
            });
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              state: "closed",
            });
