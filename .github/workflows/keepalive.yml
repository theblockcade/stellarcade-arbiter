name: Keepalive

# Pings /health on a schedule so the free-tier Render deployment doesn't
# cold-start on the next real request during active development. Not needed
# (and not worth the noise) once the service is on a paid plan that doesn't
# sleep.

on:
  schedule:
    - cron: "*/10 6-22 * * 1-5" # every 10 min, 06:00-22:00 UTC, weekdays
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          curl -fsS "${{ vars.ARBITER_HEALTH_URL || 'https://stellarcade-arbiter.onrender.com/health' }}" \
            || echo "Health check failed or service not yet deployed — non-fatal for this workflow."
