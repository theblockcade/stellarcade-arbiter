# Render Blueprint — arbiter service + Postgres (free tier).
#
# Free-tier caveats:
#   - the web service SLEEPS after 15 min idle (~1 min cold start on next hit)
#   - the free Postgres EXPIRES 30 days after creation (14-day grace)
# Acceptable for a testnet demo; swap in an external Postgres (Neon, etc) and
# set DATABASE_URL as a secret for anything longer-lived.

services:
  - type: web
    name: stellarcade-arbiter
    runtime: docker
    plan: free
    # Deploy manually (or from a tagged release) after CI is green — do not
    # auto-deploy every push. See stellarcade-arbiter/docs/decisions.md and
    # the equivalent CD gate in the vellar-facilitator project this pattern
    # is drawn from.
    autoDeploy: false
    healthCheckPath: /health
    # Runs before each new instance starts serving. migrations/001_init.sql
    # is entirely CREATE TABLE/INDEX IF NOT EXISTS, so re-running it on
    # every deploy is safe — there's no separate migration-tracking table.
    # Without this, the service boots fine (health check doesn't touch the
    # DB) but every DB-backed route 500s on a fresh database, since nothing
    # else in this Blueprint ever created commitments/settlements/
    # audit_log/bot_links.
    preDeployCommand: npm run migrate
    envVars:
      - key: NODE_ENV
        value: "production"
      - key: STELLAR_NETWORK
        value: "testnet"
      - key: STELLAR_RPC_URL
        value: "https://soroban-testnet.stellar.org"
      - key: HORIZON_URL
        value: "https://horizon-testnet.stellar.org"
      - key: CORS_ORIGIN
        value: "https://theblockcade.xyz"
      - key: DATABASE_URL
        fromDatabase:
          name: stellarcade-arbiter-db
          property: connectionString
      # Required — the arbiter refuses to boot in production without this
      # (security-audit.md H1). Set as a real secret in the Render
      # dashboard after the Blueprint is synced; sync: false means Render
      # won't overwrite a manually-set value on redeploy.
      - key: ARBITER_API_KEYS
        sync: false

databases:
  - name: stellarcade-arbiter-db
    plan: free
